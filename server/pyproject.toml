[project]
name = "server"
version = "0.1.0"
description = "Initial Backend Setup"
readme = "README.md"
authors = [
    { name = "kamlesh-codedev", email = "kamlesh.a2007@gamil.com" }
]
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.3.2",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.6.1",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.1",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
